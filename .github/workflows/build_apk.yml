name: ByteMeter CI & APK Build

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Build Debug APKs'
        required: true
        type: boolean
        default: true
      build_release:
        description: 'Build Release APKs'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Analyze & Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter Dependencies
        run: flutter pub get

      # =========================================================================
      # Step 1: Flutter Test
      # =========================================================================
      - name: Step 1 - Run Flutter Tests
        run: flutter test --no-pub

      # =========================================================================
      # Step 2: Flutter Analyze
      # =========================================================================
      - name: Step 2 - Run Flutter Analyze
        run: flutter analyze --no-pub

      # =========================================================================
      # Step 3: Build Debug Split APKs
      # =========================================================================
      - name: Step 3 - Build Debug Split APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        run: |
          flutter build apk --debug --split-per-abi
          cd build/app/outputs/flutter-apk/
          # Exclude x86 / x86_64
          rm -f *x86*.apk *x64*.apk
          # Rename to bytemeter-<abi>-debug.apk
          for f in app-*-debug.apk; do
            if [ -f "$f" ]; then
              mv "$f" "${f/app-/bytemeter-}"
            fi
          done
          ls -la

      - name: Upload Debug arm64-v8a APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: bytemeter-arm64-v8a-debug
          path: build/app/outputs/flutter-apk/bytemeter-arm64-v8a-debug.apk
          retention-days: 14

      - name: Upload Debug armeabi-v7a APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: bytemeter-armeabi-v7a-debug
          path: build/app/outputs/flutter-apk/bytemeter-armeabi-v7a-debug.apk
          retention-days: 14

      # =========================================================================
      # Step 4: Build Release Split APKs
      # =========================================================================
      - name: Step 4 - Build Release Split APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        run: |
          flutter build apk --release --split-per-abi
          cd build/app/outputs/flutter-apk/
          # Exclude x86 / x86_64
          rm -f *x86*.apk *x64*.apk
          # Rename to bytemeter-<abi>-release.apk
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              mv "$f" "${f/app-/bytemeter-}"
            fi
          done
          ls -la

      - name: Upload Release arm64-v8a APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: bytemeter-arm64-v8a-release
          path: build/app/outputs/flutter-apk/bytemeter-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload Release armeabi-v7a APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: bytemeter-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/bytemeter-armeabi-v7a-release.apk
          retention-days: 30

      # =========================================================================
      # Step 5: Build Summary
      # =========================================================================
      - name: Summary
        if: always()
        run: |
          echo "### 🚀 ByteMeter CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Channel:** \`stable\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** \`17\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests:** Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter & Analyzer:** Clean ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📦 Packaged APK Outputs (x64 Excluded):" >> $GITHUB_STEP_SUMMARY
          echo "- \`bytemeter-arm64-v8a-release.apk\` (Modern 64-bit ARM)" >> $GITHUB_STEP_SUMMARY
          echo "- \`bytemeter-armeabi-v7a-release.apk\` (Legacy 32-bit ARM)" >> $GITHUB_STEP_SUMMARY
          echo "- \`bytemeter-arm64-v8a-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`bytemeter-armeabi-v7a-debug.apk\`" >> $GITHUB_STEP_SUMMARY
