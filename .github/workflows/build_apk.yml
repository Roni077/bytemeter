name: ByteMeter CI & APK Build

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Build Debug APK'
        required: true
        type: boolean
        default: true
      build_release:
        description: 'Build Release APK'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Analyze & Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter Dependencies
        run: flutter pub get

      # =========================================================================
      # Step 1: Flutter Test
      # =========================================================================
      - name: Step 1 - Run Flutter Tests
        run: flutter test --no-pub

      # =========================================================================
      # Step 2: Flutter Analyze
      # =========================================================================
      - name: Step 2 - Run Flutter Analyze
        run: flutter analyze --no-pub

      # =========================================================================
      # Step 3: Build Debug APK
      # =========================================================================
      - name: Step 3 - Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: bytemeter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # =========================================================================
      # Step 4: Build Release APK
      # =========================================================================
      - name: Step 4 - Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: bytemeter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # =========================================================================
      # Step 5: Build Summary
      # =========================================================================
      - name: Summary
        if: always()
        run: |
          echo "### 🚀 ByteMeter CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Channel:** \`stable\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** \`17\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests:** Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter & Analyzer:** Clean ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts:** Uploaded to GitHub Actions Run 📦" >> $GITHUB_STEP_SUMMARY
